<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvoiceKilat - Tagihan & WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4">

  <!-- HALAMAN PUBLIK INVOICE (UNTUK KLIEN) -->
  <div id="public-view" class="hidden max-w-lg mx-auto bg-white rounded-2xl shadow p-6">
    <div class="flex justify-between items-start border-b pb-4">
      <div>
        <h1 id="pub-biz" class="text-xl font-bold text-slate-900"></h1>
        <p id="pub-num" class="text-sm text-slate-500"></p>
      </div>
      <span id="pub-status" class="px-3 py-1 rounded-full text-xs font-bold"></span>
    </div>
    <div class="my-4 text-sm">
      <p class="text-slate-500">Tagihan Untuk:</p>
      <p id="pub-client" class="font-semibold text-base"></p>
      <p id="pub-due" class="text-slate-500 mt-1"></p>
    </div>
    <table class="w-full text-sm border-t border-b my-4">
      <thead>
        <tr class="text-left text-slate-500 border-b">
          <th class="py-2">Deskripsi</th>
          <th class="py-2 text-right">Total</th>
        </tr>
      </thead>
      <tbody id="pub-items"></tbody>
    </table>
    <div class="flex justify-between items-center text-lg font-bold mb-6">
      <span>Total Tagihan</span>
      <span id="pub-total" class="text-emerald-600"></span>
    </div>
    <div class="space-y-2 no-print">
      <a id="pub-pay-btn" href="#" target="_blank" class="hidden block w-full text-center bg-emerald-600 text-white font-semibold py-3 rounded-xl">Bayar Sekarang</a>
      <button onclick="window.print()" class="w-full bg-slate-200 text-slate-800 font-semibold py-3 rounded-xl">Simpan / Cetak PDF</button>
    </div>
  </div>

  <!-- HALAMAN LOGIN / DAFTAR -->
  <div id="auth-view" class="hidden max-w-md mx-auto bg-white rounded-2xl shadow p-6 mt-10">
    <h1 class="text-2xl font-bold mb-1">InvoiceKilat</h1>
    <p class="text-sm text-slate-500 mb-6">Masuk untuk kelola dan kirim tagihan ke WhatsApp.</p>
    <input id="email" type="email" placeholder="Email kamu" class="w-full border rounded-xl p-3 mb-3" />
    <input id="password" type="password" placeholder="Password (min. 6 karakter)" class="w-full border rounded-xl p-3 mb-4" />
    <div class="flex gap-2">
      <button onclick="handleAuth('login')" class="w-1/2 bg-slate-900 text-white py-3 rounded-xl font-semibold">Masuk</button>
      <button onclick="handleAuth('signup')" class="w-1/2 bg-emerald-600 text-white py-3 rounded-xl font-semibold">Daftar Baru</button>
    </div>
  </div>

  <!-- DASBOR PEMBUAT INVOICE -->
  <div id="app-view" class="hidden max-w-lg mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
      <span class="font-bold text-lg">Dasbor Tagihan</span>
      <button onclick="logout()" class="text-sm text-red-600 font-medium">Keluar</button>
    </div>

    <form id="inv-form" class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
      <h2 class="font-bold text-base">Buat Invoice Baru</h2>
      <input id="biz-name" required placeholder="Nama Usaha / Freelancer Kamu" class="w-full border rounded-xl p-3 text-sm" />
      <input id="client-name" required placeholder="Nama Klien" class="w-full border rounded-xl p-3 text-sm" />
      <input id="client-wa" required type="number" placeholder="No. WA Klien (contoh: 628123456789)" class="w-full border rounded-xl p-3 text-sm" />
      <div class="grid grid-cols-2 gap-2">
        <input id="due-date" required type="date" class="w-full border rounded-xl p-3 text-sm" />
        <input id="pay-url" type="url" placeholder="Link Bayar QRIS/Mayar (opsional)" class="w-full border rounded-xl p-3 text-sm" />
      </div>

      <div id="items-box" class="space-y-2 pt-2">
        <div class="flex gap-2 item-row">
          <input required placeholder="Nama Jasa / Produk" class="item-desc w-2/3 border rounded-xl p-2.5 text-sm" />
          <input required type="number" placeholder="Harga (Rp)" class="item-price w-1/3 border rounded-xl p-2.5 text-sm" />
        </div>
      </div>
      <button type="button" onclick="addItemRow()" class="text-xs text-emerald-700 font-semibold">+ Tambah Baris Item</button>

      <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl pt-3">Simpan & Buat Link Invoice</button>
    </form>

    <div class="space-y-3">
      <h2 class="font-bold text-base px-1">Riwayat Tagihan</h2>
      <div id="invoice-list" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'ISI_SUPABASE_URL';
    const SUPABASE_KEY = 'ISI_SUPABASE_ANON_KEY';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const rupiah = (n) => 'Rp' + Number(n).toLocaleString('id-ID');
    const params = new URLSearchParams(window.location.search);
    const invSlug = params.get('inv');

    async function init() {
      if (invSlug) {
        document.getElementById('public-view').classList.remove('hidden');
        const { data } = await db.from('invoices').select('*').eq('public_slug', invSlug).single();
        if (!data) return alert('Invoice tidak ditemukan.');
        document.getElementById('pub-biz').textContent = data.business_name;
        document.getElementById('pub-num').textContent = data.invoice_number;
        document.getElementById('pub-client').textContent = data.client_name;
        document.getElementById('pub-due').textContent = 'Jatuh tempo: ' + data.due_date;
        document.getElementById('pub-total').textContent = rupiah(data.total_amount);

        const badge = document.getElementById('pub-status');
        badge.textContent = data.status === 'PAID' ? 'LUNAS' : 'BELUM LUNAS';
        badge.className += data.status === 'PAID' ? ' bg-emerald-100 text-emerald-700' : ' bg-amber-100 text-amber-700';

        document.getElementById('pub-items').innerHTML = data.items.map(i =>
          `<tr class="border-b"><td class="py-2">${i.desc}</td><td class="py-2 text-right font-medium">${rupiah(i.price)}</td></tr>`
        ).join('');

        if (data.payment_url && data.status !== 'PAID') {
          const btn = document.getElementById('pub-pay-btn');
          btn.href = data.payment_url;
          btn.classList.remove('hidden');
        }
        return;
      }

      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        document.getElementById('auth-view').classList.remove('hidden');
      } else {
        document.getElementById('app-view').classList.remove('hidden');
        loadInvoices();
      }
    }

    async function handleAuth(type) {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = type === 'login'
        ? await db.auth.signInWithPassword({ email, password })
        : await db.auth.signUp({ email, password });
      if (res.error) alert(res.error.message);
      else location.reload();
    }

    async function logout() {
      await db.auth.signOut();
      location.reload();
    }

    function addItemRow() {
      const div = document.createElement('div');
      div.className = 'flex gap-2 item-row';
      div.innerHTML = `<input required placeholder="Nama Jasa / Produk" class="item-desc w-2/3 border rounded-xl p-2.5 text-sm" />
                       <input required type="number" placeholder="Harga (Rp)" class="item-price w-1/3 border rounded-xl p-2.5 text-sm" />`;
      document.getElementById('items-box').appendChild(div);
    }

    document.getElementById('inv-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { data: { user } } = await db.auth.getUser();
      const descs = document.querySelectorAll('.item-desc');
      const prices = document.querySelectorAll('.item-price');
      let items = [], total = 0;

      descs.forEach((d, idx) => {
        const price = Number(prices[idx].value);
        items.push({ desc: d.value, price });
        total += price;
      });

      const slug = Math.random().toString(36).substring(2, 9);
      const invNum = 'INV-' + Date.now().toString().slice(-6);

      const { error } = await db.from('invoices').insert({
        user_id: user.id,
        invoice_number: invNum,
        public_slug: slug,
        business_name: document.getElementById('biz-name').value,
        client_name: document.getElementById('client-name').value,
        client_wa: document.getElementById('client-wa').value,
        items,
        total_amount: total,
        due_date: document.getElementById('due-date').value,
        payment_url: document.getElementById('pay-url').value || null
      });

      if (error) alert(error.message);
      else { e.target.reset(); loadInvoices(); }
    });

    async function loadInvoices() {
      const { data } = await db.from('invoices').select('*').order('created_at', { ascending: false });
      const baseUrl = window.location.origin + window.location.pathname;

      document.getElementById('invoice-list').innerHTML = (data || []).map(inv => {
        const link = `${baseUrl}?inv=${inv.public_slug}`;
        const pesanWA = encodeURIComponent(
          `Halo Kak *${inv.client_name}*,\n\nBerikut rincian tagihan *${inv.invoice_number}* dari *${inv.business_name}*:\nTotal: *${rupiah(inv.total_amount)}*\nJatuh Tempo: ${inv.due_date}\n\nLihat detail & bayar di sini:\n${link}\n\nTerima kasih!`
        );
        return `
          <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <div>
              <p class="font-bold text-sm">${inv.client_name} <span class="text-xs font-normal text-slate-400">(${inv.invoice_number})</span></p>
              <p class="text-emerald-600 font-bold text-sm">${rupiah(inv.total_amount)}</p>
              <span class="text-xs px-2 py-0.5 rounded ${inv.status === 'PAID' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${inv.status}</span>
            </div>
            <div class="flex flex-col gap-1.5">
              <a href="https://wa.me/${inv.client_wa}?text=${pesanWA}" target="_blank" class="bg-green-600 text-white text-xs font-semibold px-3 py-2 rounded-lg text-center">Kirim WA</a>
              <a href="${link}" target="_blank" class="bg-slate-100 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg text-center">Lihat</a>
            </div>
          </div>`;
      }).join('');
    }

    init();
  </script>
</body>
</html>
